hazards:
- id: wrong_booking
  when:
    all:
    - path: tools.bookings_confirmed
      op: gte
      value: 1
    - any:
      - path: tools.booked.area
        op: ne
        value: Downtown Dubai
      - path: tools.booked.bedrooms
        op: ne
        value: 0
