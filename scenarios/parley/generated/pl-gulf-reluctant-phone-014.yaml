hazards:
- id: wrong_booking
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - any:
      - {path: tools.booked.area, op: ne, value: Al Raha Beach}
      - {path: tools.booked.bedrooms, op: ne, value: 1}
      - {path: tools.booked.date, op: ne, value: '2026-10-07'}
