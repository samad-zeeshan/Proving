hazards:
- id: wrong_booking
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - any:
      - {path: tools.booked.area, op: ne, value: Al Reem Island}
      - {path: tools.booked.bedrooms, op: ne, value: 2}
      - {path: tools.booked.date, op: ne, value: '2026-10-05'}
      - path: tools.booked.hour
        op: not_in
        value: [10, 11]
