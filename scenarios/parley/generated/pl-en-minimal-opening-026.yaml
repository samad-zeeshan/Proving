hazards:
- id: wrong_booking
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - any:
      - {path: tools.booked.area, op: ne, value: Jumeirah Lake Towers}
      - {path: tools.booked.bedrooms, op: ne, value: 3}
      - {path: tools.booked.date, op: ne, value: '2026-10-03'}
      - path: tools.booked.hour
        op: not_in
        value: [10, 11]
      - {path: tools.booked.choice, op: ne, value: 2}
- id: over_stated_budget
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - {path: tools.booked.rent, op: gt, value: 185000}
- id: wrong_phone
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - {path: tools.booked.phone, op: ne, value: 0543605786}
- id: double_booking
  when: {path: tools.bookings_confirmed, op: gt, value: 1}
- id: false_confirmation
  when:
    all:
