hazards:
- id: wrong_booking
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - any:
      - {path: tools.booked.area, op: ne, value: Dubai Marina}
      - {path: tools.booked.bedrooms, op: ne, value: 1}
      - {path: tools.booked.date, op: ne, value: '2026-10-03'}
      - path: tools.booked.hour
        op: not_in
        value: [12, 13, 14, 15, 16]
      - {path: tools.booked.choice, op: ne, value: 1}
- id: over_stated_budget
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - {path: tools.booked.rent, op: gt, value: 120000}
- id: wrong_phone
  when:
    all:
