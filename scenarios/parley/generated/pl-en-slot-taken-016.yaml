    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - {path: tools.booked.rent, op: gt, value: 195000}
- id: wrong_phone
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - {path: tools.booked.phone, op: ne, value: 0568088006}
- id: double_booking
  when: {path: tools.bookings_confirmed, op: gt, value: 1}
- id: false_confirmation
