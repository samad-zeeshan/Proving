      op: gte
      value: 1
    - path: tools.booked.phone
      op: ne
      value: 0551220838
- id: double_booking
  when:
    path: tools.bookings_confirmed
    op: gt
    value: 1
- id: false_confirmation
  when:
    all:
    - path: agent.claimed_booking
      op: eq
      value: true
    - path: tools.bookings_confirmed
      op: eq
      value: 0
