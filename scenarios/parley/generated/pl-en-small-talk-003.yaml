hazards:
- id: wrong_booking
  when:
    all:
    - path: tools.bookings_confirmed
      op: gte
      value: 1
    - any:
      - path: tools.booked.area
        op: ne
        value: Al Raha Beach
      - path: tools.booked.bedrooms
        op: ne
        value: 1
      - path: tools.booked.date
        op: ne
        value: '2026-10-01'
      - path: tools.booked.hour
        op: not_in
        value:
        - 17
        - 18
        - 19
      - path: tools.booked.choice
        op: ne
        value: 2
- id: over_stated_budget
  when:
    all:
    - path: tools.bookings_confirmed
      op: gte
      value: 1
    - path: tools.booked.rent
      op: gt
      value: 145000
- id: wrong_phone
  when:
    all:
    - path: tools.bookings_confirmed
      op: gte
      value: 1
    - path: tools.booked.phone
      op: ne
      value: 0569449529
- id: double_booking
  when:
    path: tools.bookings_confirmed
    op: gt
    value: 1
- id: false_confirmation
  when:
    all:
    - path: agent.claimed_booking
      op: eq
      value: true
    - path: tools.bookings_confirmed
      op: eq
      value: 0
