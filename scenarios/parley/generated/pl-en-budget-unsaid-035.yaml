hazards:
- id: wrong_booking
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - any:
      - {path: tools.booked.area, op: ne, value: Al Raha Beach}
      - {path: tools.booked.bedrooms, op: ne, value: 2}
      - {path: tools.booked.date, op: ne, value: '2026-10-06'}
      - path: tools.booked.hour
        op: not_in
        value: [12, 13, 14, 15, 16]
      - {path: tools.booked.choice, op: ne, value: 1}
- id: wrong_phone
