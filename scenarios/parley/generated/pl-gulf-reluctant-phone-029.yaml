hazards:
- id: wrong_booking
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - any:
      - {path: tools.booked.area, op: ne, value: Khalifa City}
      - {path: tools.booked.bedrooms, op: ne, value: 3}
      - {path: tools.booked.date, op: ne, value: '2026-10-04'}
