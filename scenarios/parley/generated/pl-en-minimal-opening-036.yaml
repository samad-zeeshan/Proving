hazards:
- id: wrong_booking
  when:
    all:
    - {path: tools.bookings_confirmed, op: gte, value: 1}
    - any:
      - {path: tools.booked.area, op: ne, value: Al Barsha}
      - {path: tools.booked.bedrooms, op: ne, value: 2}
      - {path: tools.booked.date, op: ne, value: '2026-10-03'}
      - path: tools.booked.hour
